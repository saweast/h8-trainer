name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fail loudly instead of deploying a demo-mode build. Reports only whether a name is set.
      - name: Check Supabase config
        if: github.event_name != 'pull_request'
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          # Common wrong names, checked only to explain the failure.
          ALT_NAMES: >-
            SUPABASE_URL=${{ secrets.SUPABASE_URL != '' || vars.SUPABASE_URL != '' }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY != '' || vars.SUPABASE_ANON_KEY != '' }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' || vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' || vars.NEXT_PUBLIC_SUPABASE_URL != '' }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error title=Supabase config missing::VITE_SUPABASE_URL set: $([ -n "$URL" ] && echo yes || echo no); VITE_SUPABASE_ANON_KEY set: $([ -n "$KEY" ] && echo yes || echo no). Other names: ${ALT_NAMES}. Add both under Settings > Secrets and variables > Actions > Repository secrets (not Environment secrets)."
            exit 1
          fi
          case "$KEY" in
            sb_secret_*) echo "::error title=Wrong key::VITE_SUPABASE_ANON_KEY holds a Supabase SECRET key. Use the publishable key (sb_publishable_...) and rotate the secret key."; exit 1 ;;
          esac
          case "$URL" in
            https://*.supabase.co) ;;
            *) echo "::error title=Wrong URL::VITE_SUPABASE_URL must look like https://<ref>.supabase.co"; exit 1 ;;
          esac
          echo "Supabase config present."
      - name: Build
        run: npm run build
        env:
          # Without these the site builds in demo mode. Both values are public (they ship in the
          # bundle), so repository variables work as well as secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
